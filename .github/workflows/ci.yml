name: CI - Spring Boot & Docker Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bấm chạy thủ công từ giao diện GitHub Actions

env:
  # Cấu hình tên Docker image (mặc định lấy theo username Docker Hub hoặc repo name)
  IMAGE_NAME: product-service

jobs:
  # ========================================================
  # Job 1: Test & Build mã nguồn Spring Boot bằng Gradle
  # ========================================================
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    # Khởi tạo MySQL container để phục vụ chạy Unit/Integration Test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: productdb
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # Tự động cache Gradle dependencies để tối ưu tốc độ build

      - name: 3. Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: 4. Chạy Unit Tests
        env:
          # Kết nối tới service MySQL container đang chạy trên port 3306 của host runner
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/productdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: ./gradlew test

      - name: 5. Lưu báo cáo Test (Test Report)
        uses: actions/upload-artifact@v4
        if: always() # Luôn lưu dù test pass hay fail để dễ debug
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7

      - name: 6. Build file Boot JAR
        run: ./gradlew bootJar -x test --no-daemon

      - name: 7. Lưu trữ file JAR (Build Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

  # ========================================================
  # Job 2: Build & Push Docker Image
  # ========================================================
  docker-build:
    name: Build & Push Docker Image
    needs: build-and-test # Chỉ chạy khi Job 1 (build & test) thành công
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Docker Buildx (hỗ trợ cache & multi-stage)
        uses: docker/setup-buildx-action@v3

      # Kiểm tra và đăng nhập Docker Hub nếu người dùng đã cấu hình Secret
      - name: 3. Đăng nhập Docker Hub
        if: env.DOCKERHUB_USERNAME != 'thontsieuxayda' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Trích xuất metadata (tag latest, commit SHA, branch)
      - name: 4. Tạo metadata & tag cho Docker Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/{1}', env.DOCKERHUB_USERNAME, env.IMAGE_NAME) || env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      # Build Docker Image (và tự động push nếu có thông tin Docker Hub Secrets)
      - name: 5. Build và Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: app
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Sử dụng GitHub Actions Cache để tăng tốc quá trình build docker layers
          cache-from: type=gha
          cache-to: type=gha,mode=max
