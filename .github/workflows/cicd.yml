name: CI/CD - Spring Boot & Docker Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bấm chạy thủ công từ giao diện GitHub Actions

env:
  # Cấu hình tên Docker image (mặc định lấy theo username Docker Hub hoặc repo name)
  IMAGE_NAME: product-service

jobs:
  # ========================================================
  # Job 1: Test & Build mã nguồn Spring Boot bằng Gradle
  # ========================================================
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    # Khởi tạo MySQL container để phục vụ chạy Unit/Integration Test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: productdb
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # Tự động cache Gradle dependencies để tối ưu tốc độ build

      - name: 3. Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: 4. Chạy Unit Tests
        env:
          # Kết nối tới service MySQL container đang chạy trên port 3306 của host runner
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/productdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: ./gradlew test

      - name: 5. Lưu báo cáo Test (Test Report)
        uses: actions/upload-artifact@v4
        if: always() # Luôn lưu dù test pass hay fail để dễ debug
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7

      - name: 6. Build file Boot JAR 
        run: ./gradlew bootJar -x test --no-daemon

      - name: 7. Lưu trữ file JAR (Build Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

  # ========================================================
  # Job 2: Build & Push Docker Image
  # ========================================================
  docker-build:
    name: Build & Push Docker Image
    needs: build-and-test # Chỉ chạy khi Job 1 (build & test) thành công
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Docker Buildx (hỗ trợ cache & multi-stage)
        uses: docker/setup-buildx-action@v3

      - name: 3. Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Tạo metadata & tag cho Docker Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: 5. Build và Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Sử dụng GitHub Actions Cache để tăng tốc quá trình build docker layers
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Job 3: Continuous Deployment (CD) - Tự động Deploy lên VPS
  # ========================================================
  deploy:
    name: Deploy to VPS Server
    needs: docker-build # Chỉ chạy khi build & push image Docker thành công
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Chỉ deploy khi push vào main

    steps:
      - name: Thực thi Deploy lên VPS qua SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=================================================="
            echo " BẮT ĐẦU QUY TRÌNH DEPLOY LÊN VPS: $(date)"
            echo "=================================================="

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

            # 1. Pull Docker image mới nhất từ Docker Hub
            echo "-> 1. Đang pull image mới nhất: $IMAGE..."
            docker pull $IMAGE

            # 2. Dừng và xóa container cũ (nếu có)
            echo "-> 2. Dừng và xóa container product-service cũ..."
            docker stop ${{ env.IMAGE_NAME }} 2>/dev/null || true
            docker rm ${{ env.IMAGE_NAME }} 2>/dev/null || true

            # 3. Đảm bảo mạng my-network đã tồn tại
            echo "-> 3. Kiểm tra Docker Network..."
            docker network create my-network 2>/dev/null || true

            # 4. Khởi chạy container mới với image vừa tải về (port 8093)
            echo "-> 4. Khởi chạy container ${{ env.IMAGE_NAME }} mới trên port 8093..."
            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              --restart always \
              --network my-network \
              -p 8093:8093 \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://mysql-db:3306/productdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true" \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD=root \
              $IMAGE

            # 5. Dọn dẹp image dangling/rác để giải phóng ổ cứng server
            echo "-> 5. Dọn dẹp Docker images rác..."
            docker image prune -f

            echo "=================================================="
            echo " DEPLOY HOÀN TẤT THÀNH CÔNG!"
            echo " Trạng thái container:"
            docker ps --filter "name=${{ env.IMAGE_NAME }}"
            echo "=================================================="
